<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background with subtle rounding -->
  <rect width="32" height="32" rx="5" fill="#16243f"/>
  <!-- Gold vertical bar — the logo's bracket mark -->
  <rect x="5" y="6" width="3" height="20" rx="1.5" fill="#c79a4b"/>
  <!-- KARN — light weight, smaller -->
  <text
    x="11" y="15"
    font-family="'Sora', 'Inter', Arial, sans-serif"
    font-size="8.5"
    font-weight="300"
    letter-spacing="0.5"
    fill="rgba(255,255,255,0.88)"
  >KARN</text>
  <!-- HR — bold, larger -->
  <text
    x="11" y="25"
    font-family="'Sora', 'Inter', Arial, sans-serif"
    font-size="11"
    font-weight="800"
    fill="#ffffff"
  >HR</text>
</svg>
